services:
  db:
    image: postgres:16-alpine
    container_name: trackom_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackom
      POSTGRES_PASSWORD: trackom_secret
      POSTGRES_DB: trackom_db
    ports:
      - "5432:5432"
    volumes:
      - trackom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackom -d trackom_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - trackom_net

networks:
  trackom_net:
    driver: bridge

volumes:
  trackom_pgdata:

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src https://fonts.gstatic.com; connect-src 'self' http://localhost:8000 https://*.trackomgroup.com https://accounts.google.com https://oauth2.googleapis.com; img-src 'self' data: https:; frame-src 'self' https://accounts.google.com; worker-src 'self';" />
    
    <!-- SEO -->
    <title>Trackom</title>
    <meta name="description" content="Trackom is Kenya's leading enterprise bulk SMS, USSD, WhatsApp Business API, OTP verification, and communications platform. Send smarter, scale faster, deliver instantly." />
    <meta name="keywords" content="bulk SMS Kenya, SMS API, USSD services, WhatsApp Business API, OTP verification, airtime API, Trackom, enterprise SMS" />
    <link rel="canonical" href="https://trackomgroup.com" />
    
    <!-- OG Tags -->
    <meta property="og:title" content="Trackom | Enterprise Communications Platform" />
    <meta property="og:description" content="Kenya's #1 Bulk SMS, USSD, WhatsApp API & OTP platform. AI-powered tools, developer-first API, 99.99% uptime." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trackomgroup.com" />
    <meta property="og:image" content="https://trackomgroup.com/images/trackom-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta property="og:image:type" content="image/jpeg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trackom | Enterprise Communications Platform" />
    <meta name="twitter:description" content="Send smarter. Scale faster. Deliver instantly." />
    <meta name="twitter:image" content="https://trackomgroup.com/images/trackom-preview.jpg" />
    
    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Theme -->
    <meta name="theme-color" content="#6366F1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-512.svg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Trackom",
      "url": "https://trackomgroup.com",
      "description": "Kenya's leading enterprise bulk SMS, USSD, WhatsApp Business API, OTP verification, and communications platform.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "url": "https://trackomgroup.com/contact"
      },
      "sameAs": []
    }
    </script>

    <!-- Theme Initialization Script -->
    <script>
      (function() {
        const stored = localStorage.getItem('trackom-theme');
        if (stored) {
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } else {
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (systemDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
